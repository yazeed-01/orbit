[package]
name = "orbit"
version = "1.0.0"
edition = "2021"
description = "Orbit - radial right-click menu for Windows Explorer"
license = "MIT"

[dependencies]
base64 = "0.22"
lopdf = "0.34"
md-5 = "0.10"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation_Numerics",
    "Data_Pdf",
    "Foundation",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
]

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
